<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — Payment Successful</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#020408; color:#c8e6f0; font-family:'Orbitron',monospace; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.box { text-align:center; max-width:500px; padding:60px 40px; border:1px solid rgba(57,255,20,0.2); background:rgba(57,255,20,0.03); }
.icon { font-size:4rem; margin-bottom:24px; animation:bounce 0.8s ease; }
@keyframes bounce { 0%{transform:scale(0);} 60%{transform:scale(1.2);} 100%{transform:scale(1);} }
h1 { font-size:1.8rem; color:#39ff14; margin-bottom:12px; letter-spacing:2px; text-shadow:0 0 20px rgba(57,255,20,0.5); }
p { font-family:'JetBrains Mono',monospace; font-size:0.8rem; color:rgba(200,230,240,0.5); margin-bottom:36px; line-height:1.6; }
a { display:inline-block; padding:14px 36px; background:linear-gradient(135deg,#00f5ff,#0088ff); color:#020408; font-family:'Orbitron',monospace; font-size:0.75rem; font-weight:700; letter-spacing:3px; text-decoration:none; clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%); }
</style>
</head>
<body>
<div class="box">
  <div class="icon">✓</div>
  <h1>UPGRADE COMPLETE</h1>
  <p>Welcome to {{ user.plan|upper }} plan, {{ user.username }}.<br>Your agent now has enhanced capabilities.<br>Let's get to work.</p>
  <a href="/dashboard">LAUNCH NEXUS →</a>
</div>
</body>
</html>
